name: 构建与测试

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 测试
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e '.[test]'

      - name: 编译检查
        run: python3 -m compileall -q tyranor

      - name: 单元测试
        run: python3 -m unittest discover -s tests -v

  rpm:
    name: 构建 RPM
    runs-on: ubuntu-latest
    container: fedora:latest
    needs: test
    steps:
      - name: 安装构建工具
        run: |
          dnf install -y \
            bzip2 \
            curl \
            gcc \
            gcc-c++ \
            git \
            python3-devel \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            rpm-build \
            tar \
            unzip \
            xz \
            zip

      - name: 检出源码
        uses: actions/checkout@v4

      - name: 构建主程序 RPM
        run: ./packaging/build-rpm.sh

      - name: 构建 Ren'Py RPM
        run: ./packaging/build-renpy-rpm.sh

      - name: 检查 RPM 完整性
        run: rpm -K --nosignature dist/release/*.rpm dist/source/*.src.rpm

      - name: 上传二进制 RPM 产物
        uses: actions/upload-artifact@v4
        with:
          name: tyranor-next-rpms
          path: |
            dist/release/*.rpm
          if-no-files-found: error

      - name: 上传源码 RPM 产物
        uses: actions/upload-artifact@v4
        with:
          name: tyranor-next-source-rpms
          path: |
            dist/source/*.src.rpm
          if-no-files-found: error

  release:
    name: 发布 RPM Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: rpm
    permissions:
      contents: write
    steps:
      - name: 下载二进制 RPM
        uses: actions/download-artifact@v4
        with:
          name: tyranor-next-rpms
          path: dist/release

      - name: 发布非源码 RPM
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/*.rpm --generate-notes
