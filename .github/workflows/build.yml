name: 构建与测试

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 测试
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -e '.[test]'

      - name: 编译检查
        run: python3 -m compileall -q tyranor

      - name: 单元测试
        run: python3 -m unittest discover -s tests -v

  rpm:
    name: 构建 RPM
    runs-on: ubuntu-latest
    container: fedora:latest
    needs: test
    steps:
      - name: 安装构建工具
        run: |
          dnf install -y \
            bzip2 \
            curl \
            gcc \
            gcc-c++ \
            git \
            python3-devel \
            python3-pip \
            python3-setuptools \
            python3-wheel \
            rpm-build \
            tar \
            unzip \
            xz \
            zip

      - name: 检出源码
        uses: actions/checkout@v4

      - name: 构建主程序 RPM
        run: ./packaging/build-rpm.sh

      - name: 构建 Ren'Py RPM
        run: ./packaging/build-renpy-rpm.sh

      - name: 检查 RPM 完整性
        run: rpm -K --nosignature dist/release/*.rpm dist/source/*.src.rpm

      - name: 上传二进制 RPM 产物
        uses: actions/upload-artifact@v4
        with:
          name: tyranor-next-rpms
          path: |
            dist/release/*.rpm
          if-no-files-found: error

      - name: 上传源码 RPM 产物
        uses: actions/upload-artifact@v4
        with:
          name: tyranor-next-source-rpms
          path: |
            dist/source/*.src.rpm
          if-no-files-found: error

  krkr:
    name: 构建 KiriKiri 源码
    runs-on: ubuntu-latest
    container: fedora:latest
    needs: test
    timeout-minutes: 90
    steps:
      - name: 安装源码构建工具
        run: |
          dnf install -y \
            alsa-lib-devel \
            autoconf \
            autoconf-archive \
            automake \
            bzip2 \
            cmake \
            curl \
            gcc \
            gcc-c++ \
            git \
            libatomic \
            libglvnd-devel \
            libtool \
            libX11-devel \
            libXcursor-devel \
            libXext-devel \
            libXfixes-devel \
            libXi-devel \
            libXrandr-devel \
            libXrender-devel \
            libXScrnSaver-devel \
            libxcb-devel \
            libxkbcommon-devel \
            mesa-libEGL-devel \
            mesa-libGL-devel \
            nasm \
            ninja-build \
            patch \
            patchelf \
            perl \
            pkgconf-pkg-config \
            rpm-build \
            tar \
            unzip \
            vulkan-loader-devel \
            wayland-devel \
            wayland-protocols-devel \
            which \
            xz \
            zip

      - name: 检出源码和子模块
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 准备 vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      - name: 从源码构建 KiriKiri Runtime RPM
        run: ./packaging/build-krkrsdl3-source.sh

      - name: 检查 KiriKiri RPM
        run: |
          rpm -K --nosignature \
            dist/release/tyranor-next-krkr-runtime-*.x86_64.rpm \
            dist/source/tyranor-next-krkr-runtime-*.src.rpm

      - name: 上传 KiriKiri Runtime RPM
        uses: actions/upload-artifact@v4
        with:
          name: tyranor-next-krkr-rpms
          path: |
            dist/release/tyranor-next-krkr-runtime-*.x86_64.rpm
          if-no-files-found: error

      - name: 上传 KiriKiri 源码 RPM
        uses: actions/upload-artifact@v4
        with:
          name: tyranor-next-krkr-source-rpms
          path: |
            dist/source/tyranor-next-krkr-runtime-*.src.rpm
          if-no-files-found: error

  release:
    name: 发布 RPM Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - rpm
      - krkr
    permissions:
      contents: write
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 下载二进制 RPM
        uses: actions/download-artifact@v4
        with:
          name: tyranor-next-rpms
          path: dist/release

      - name: 下载 KiriKiri Runtime RPM
        uses: actions/download-artifact@v4
        with:
          name: tyranor-next-krkr-rpms
          path: dist/release

      - name: 发布非源码 RPM
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/release/*.rpm --generate-notes
