[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tyranor-next-linux"
version = "1.0.0"
description = "Native Linux desktop edition of the Tyranor Next multi-engine visual novel launcher"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-2.0-only" }
authors = [{ name = "Tyranor Next Linux contributors" }]
dependencies = [
    "PyQt6>=6.7",
    "Pillow>=10",
    "requests>=2.31",
    "cryptography>=42",
    "lxml>=5",
]

[project.optional-dependencies]
webview = ["PyQt6-WebEngine>=6.7"]
test = ["pytest>=8"]

[project.scripts]
tyranor-next = "tyranor.app:main"

[tool.setuptools]
packages = ["tyranor", "tyranor.ui"]

[tool.setuptools.package-data]
tyranor = ["assets/*.png", "assets/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
